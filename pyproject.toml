[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-etl-local"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<3", "requests>=2.32,<3", "streamlit>=1.40,<2", "plotly>=5.24,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
crypto-etl = "crypto_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

